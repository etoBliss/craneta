<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none" aria-hidden="true">
  <!--
    Craneta — Soft pattern.
    Softer successor to craneta-pattern-hero.svg: rounded shapes, soft dots,
    gentle curves. Safe to use behind cards and dashboard surfaces.
    Pure brand colors only.
  -->
  <defs>
    <pattern id="soft-dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#003459" fill-opacity="0.10"/>
    </pattern>
    <radialGradient id="soft-circle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003459" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#003459" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Soft dot field -->
  <rect x="60" y="60" width="240" height="160" fill="url(#soft-dots)"/>

  <!-- Top-right rounded stamp (echo of logo, soft) -->
  <g transform="translate(420,60)">
    <circle cx="60" cy="60" r="56" fill="url(#soft-circle)"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#003459" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="60" cy="60" r="50" fill="none" stroke="#003459" stroke-opacity="0.20" stroke-width="2" stroke-dasharray="3 9"/>
    <circle cx="60" cy="60" r="28" fill="none" stroke="#003459" stroke-opacity="0.35" stroke-width="2"/>
  </g>

  <!-- Top-left soft circles cluster -->
  <g transform="translate(40,80)">
    <circle cx="20" cy="20" r="18" fill="#003459" fill-opacity="0.12"/>
    <circle cx="56" cy="14" r="9" fill="#00171F" fill-opacity="0.10"/>
    <circle cx="38" cy="48" r="6" fill="#003459" fill-opacity="0.25"/>
  </g>

  <!-- Mid-left rounded square stack -->
  <g transform="translate(40,260)">
    <rect x="0"  y="0" width="48" height="48" rx="14" fill="#00171F" fill-opacity="0.10"/>
    <rect x="22" y="22" width="48" height="48" rx="14" fill="#003459" fill-opacity="0.18"/>
    <rect x="44" y="44" width="48" height="48" rx="14" fill="#00171F" fill-opacity="0.08"/>
  </g>

  <!-- Soft sweeping curve -->
  <g transform="translate(180,300)">
    <path d="M 0 120 C -10 60, 60 10, 160 -10 C 240 -28, 280 -80, 250 -130"
          stroke="#00171F" stroke-opacity="0.30" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M 0 120 C -10 60, 60 10, 160 -10 C 240 -28, 280 -80, 250 -130"
          stroke="#003459" stroke-opacity="0.35" stroke-width="2" fill="none" stroke-linecap="round" stroke-dasharray="2 8"/>
  </g>

  <!-- Bottom-right soft pill cluster -->
  <g transform="translate(360,440)">
    <rect x="0"  y="0"  width="80" height="24" rx="12" fill="#003459" fill-opacity="0.16"/>
    <rect x="40" y="40" width="60" height="20" rx="10" fill="#00171F" fill-opacity="0.12"/>
    <rect x="10" y="80" width="100" height="22" rx="11" fill="#003459" fill-opacity="0.10"/>
  </g>

  <!-- Sparkle accents -->
  <g transform="translate(280,140)" stroke="#003459" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-10" x2="0" y2="10"/>
    <line x1="-10" y1="0" x2="10" y2="0"/>
  </g>
  <g transform="translate(520,360)" stroke="#00171F" stroke-opacity="0.30" stroke-width="2" stroke-linecap="round">
    <line x1="0" y1="-8" x2="0" y2="8"/>
    <line x1="-8" y1="0" x2="8" y2="0"/>
  </g>
</svg>
