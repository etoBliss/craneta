<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" aria-hidden="true">
  <!--
    Craneta — Passport stamp seal.
    Reusable decoration. The double dashed ring is the signature.
    Inherits color from currentColor for fill/stroke on outer ring;
    brand deep-space used as default.
  -->
  <g>
    <circle cx="100" cy="100" r="86" fill="none" stroke="#003459" stroke-width="3"/>
    <circle cx="100" cy="100" r="86" fill="none" stroke="#003459" stroke-width="3" stroke-dasharray="3 10" transform="rotate(8 100 100)"/>
    <circle cx="100" cy="100" r="68" fill="none" stroke="#003459" stroke-width="2" stroke-opacity="0.5"/>
    <text x="100" y="78" text-anchor="middle"
          font-family="Poppins, system-ui, sans-serif"
          font-size="11" font-weight="700" letter-spacing="2"
          fill="#003459">CRANETA</text>
    <text x="100" y="132" text-anchor="middle"
          font-family="Poppins, system-ui, sans-serif"
          font-size="20" font-weight="800"
          fill="#003459">PASSPORT</text>
    <text x="100" y="152" text-anchor="middle"
          font-family="Poppins, system-ui, sans-serif"
          font-size="9" font-weight="500" letter-spacing="3"
          fill="#003459" fill-opacity="0.7">VERIFIED · OWNED</text>
  </g>
</svg>
