<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none" aria-hidden="true">
  <!--
    Craneta — Passport book illustration.
    Friendly, soft, rounded. Used in empty states and feature cards.
    Pure brand colors.
  -->
  <defs>
    <linearGradient id="book-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00171F"/>
      <stop offset="100%" stop-color="#003459"/>
    </linearGradient>
    <linearGradient id="book-page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#eef2f4"/>
    </linearGradient>
  </defs>

  <!-- Shadow under book -->
  <ellipse cx="160" cy="195" rx="120" ry="8" fill="#00171F" fill-opacity="0.12"/>

  <!-- Book back cover (slight offset for depth) -->
  <rect x="56" y="36" width="210" height="156" rx="14" fill="#003459" fill-opacity="0.4"/>

  <!-- Book cover (front) -->
  <rect x="50" y="30" width="210" height="156" rx="14" fill="url(#book-cover)"/>

  <!-- Spine line -->
  <line x1="155" y1="30" x2="155" y2="186" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="2 6"/>

  <!-- Stamp ring on right side -->
  <g transform="translate(195,108)">
    <circle r="28" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.7"/>
    <circle r="28" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="2 6"/>
    <circle r="14" fill="#FFFFFF" fill-opacity="0.10"/>
    <text text-anchor="middle" y="4"
          font-family="Poppins, system-ui, sans-serif"
          font-size="9" font-weight="800" letter-spacing="1.5"
          fill="#FFFFFF">CTX</text>
  </g>

  <!-- Wordmark on cover -->
  <text x="80" y="100"
        font-family="Poppins, system-ui, sans-serif"
        font-size="22" font-weight="800" letter-spacing="2"
        fill="#FFFFFF">CRANETA</text>
  <line x1="80" y1="112" x2="135" y2="112" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="2 4"/>
  <text x="80" y="130"
        font-family="Poppins, system-ui, sans-serif"
        font-size="7" font-weight="600" letter-spacing="2"
        fill="#FFFFFF" fill-opacity="0.7">PORTABLE · AI · CONTEXT</text>

  <!-- Page peek -->
  <rect x="62" y="158" width="186" height="22" rx="6" fill="url(#book-page)"/>
  <line x1="74" y1="167" x2="180" y2="167" stroke="#00171F" stroke-opacity="0.20" stroke-width="1.2"/>
  <line x1="74" y1="173" x2="160" y2="173" stroke="#00171F" stroke-opacity="0.12" stroke-width="1.2"/>

  <!-- Sparkles -->
  <g stroke="#003459" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="290" y1="20" x2="290" y2="32"/>
    <line x1="284" y1="26" x2="296" y2="26"/>
  </g>
  <g stroke="#003459" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4">
    <line x1="28" y1="180" x2="28" y2="190"/>
    <line x1="23" y1="185" x2="33" y2="185"/>
  </g>
</svg>
