<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" aria-hidden="true">
  <!--
    Craneta — Soft organic blob.
    Use behind text/cards for soft, friendly depth. Pure brand colors.
  -->
  <defs>
    <radialGradient id="blob-fade" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#003459" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#003459" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#003459" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="200" cy="200" rx="190" ry="180" fill="url(#blob-fade)"/>
  <ellipse cx="200" cy="200" rx="150" ry="140" fill="none" stroke="#003459" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 7"/>
</svg>
