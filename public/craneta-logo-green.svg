<svg viewBox="0 0 220 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Craneta">
  <!--
    Craneta wordmark logo — Forest Emerald mark + "Craneta" wordmark,
    intended for use on light surfaces (white, soft, ink-05). The mark
    itself is reproduced inline so consumers don't need to fetch the
    separate icon file.
  -->
  <defs>
    <linearGradient id="crLogoPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F7F3"/>
    </linearGradient>
    <linearGradient id="crLogoCrane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E5E3B"/>
      <stop offset="100%" stop-color="#094A2F"/>
    </linearGradient>
    <style>
      .cr-wordmark {
        font-family: 'Poppins', 'Segoe UI', 'Inter', system-ui, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>

  <!-- ===== Mark ===== -->
  <g transform="translate(0 0)">
    <!-- Passport page -->
    <rect x="6" y="14" width="42" height="44" rx="5" ry="5"
          fill="url(#crLogoPage)"
          stroke="#0E5E3B"
          stroke-width="2.4"/>
    <rect x="9.5" y="17.5" width="35" height="37" rx="3" ry="3"
          fill="none" stroke="#0E5E3B" stroke-width="0.8" opacity="0.18"/>

    <!-- Two content lines -->
    <rect x="11" y="22" width="20" height="2" rx="1" fill="#0E5E3B" opacity="0.55"/>
    <rect x="11" y="27" width="14" height="2" rx="1" fill="#0E5E3B" opacity="0.30"/>

    <!-- Stamp ring -->
    <g transform="translate(15 44)">
      <circle r="9.2" fill="none" stroke="#0E5E3B" stroke-width="1.6"/>
      <circle r="9.2" fill="none" stroke="#0E5E3B" stroke-width="1.6"
              stroke-dasharray="1.5 2.4" opacity="0.55"/>
      <circle r="2.6" fill="#0E5E3B"/>
    </g>

    <!-- Crane -->
    <g transform="translate(28 6)">
      <path d="M 0 22 L 14 8 L 28 14 L 24 22 L 30 22 L 22 30 L 14 26 L 6 32 L 0 22 Z"
            fill="url(#crLogoCrane)"/>
      <path d="M 14 8 L 18 0 L 22 6 Z" fill="#0E5E3B"/>
      <path d="M 14 8 L 18 22" stroke="#FFFFFF" stroke-width="0.9"
            stroke-linecap="round" opacity="0.55"/>
    </g>
  </g>

  <!-- ===== Wordmark ===== -->
  <text x="74" y="40" class="cr-wordmark" font-size="30" fill="#0E5E3B">Craneta</text>
  <text x="75" y="52" font-family="'Poppins', 'Inter', system-ui, sans-serif"
        font-weight="500" font-size="6.5" fill="#0E5E3B"
        opacity="0.55" letter-spacing="2.5">CARRY YOUR CONTEXT</text>
</svg>