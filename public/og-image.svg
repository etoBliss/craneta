<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Craneta — your portable AI context">
  <defs>
    <linearGradient id="ogBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E5E3B"/>
      <stop offset="100%" stop-color="#073A24"/>
    </linearGradient>
    <linearGradient id="ogPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F7F3"/>
    </linearGradient>
    <linearGradient id="ogCrane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E5F1EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ogBg)"/>

  <!-- Subtle ambient circles -->
  <circle cx="1100" cy="120" r="180" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="160"  cy="540" r="220" fill="#FFFFFF" opacity="0.05"/>

  <!-- Wordmark mark — passport + crane, scaled up -->
  <g transform="translate(120 110) scale(4)">
    <rect x="6" y="14" width="42" height="44" rx="5" ry="5"
          fill="url(#ogPage)" stroke="#FFFFFF" stroke-width="2.4"/>
    <rect x="9.5" y="17.5" width="35" height="37" rx="3" ry="3"
          fill="none" stroke="#0E5E3B" stroke-width="0.8" opacity="0.35"/>
    <rect x="11" y="22" width="20" height="2" rx="1" fill="#0E5E3B" opacity="0.55"/>
    <rect x="11" y="27" width="14" height="2" rx="1" fill="#0E5E3B" opacity="0.30"/>
    <g transform="translate(15 44)">
      <circle r="9.2" fill="none" stroke="#0E5E3B" stroke-width="1.6"/>
      <circle r="9.2" fill="none" stroke="#0E5E3B" stroke-width="1.6" stroke-dasharray="1.5 2.4" opacity="0.55"/>
      <circle r="2.6" fill="#0E5E3B"/>
    </g>
    <g transform="translate(28 6)">
      <path d="M 0 22 L 14 8 L 28 14 L 24 22 L 30 22 L 22 30 L 14 26 L 6 32 L 0 22 Z" fill="url(#ogCrane)"/>
      <path d="M 14 8 L 18 0 L 22 6 Z" fill="#0E5E3B"/>
      <path d="M 14 8 L 18 22" stroke="#0E5E3B" stroke-width="0.9" stroke-linecap="round" opacity="0.45"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(360 240)">
    <text x="0" y="0" font-family="Poppins, 'Segoe UI', sans-serif" font-weight="800" font-size="120" fill="#FFFFFF" letter-spacing="-2">
      Craneta
    </text>
    <text x="4" y="50" font-family="Poppins, 'Inter', system-ui, sans-serif" font-weight="500" font-size="22" fill="#9FE3BF" letter-spacing="6">
      CARRY YOUR CONTEXT
    </text>
  </g>

  <!-- Headline -->
  <text x="120" y="430" font-family="Poppins, 'Inter', system-ui, sans-serif" font-weight="700" font-size="44" fill="#FFFFFF">
    Your portable AI context — one page, every model.
  </text>

  <!-- Sub copy -->
  <text x="120" y="490" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="24" fill="rgba(255,255,255,0.78)">
    Stop pasting the same five paragraphs into every chat.
  </text>

  <!-- Footer line: domain + tagline -->
  <text x="120" y="580" font-family="Poppins, 'Inter', system-ui, sans-serif" font-weight="600" font-size="20" fill="rgba(255,255,255,0.60)" letter-spacing="3">
    CRANETA.APP
  </text>
</svg>